[project]
name = "slow_coarsening_numerics"
version = "0.1.0"
description = "Numerical code for the paper Slow coarsening of vicinal instabilities..."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "poethepoet>=0.49.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.poe.tasks]
lint = "uv run ruff check --fix ."
format = "uv run ruff format ."
clean = "rm *.png *.npz *.mp4"

[tool.poe.tasks.make_pde]
shell = """
uv run simulate_pde.py solution_trajectory.npz
uv run make_video.py solution_trajectory.npz pde_video.mp4
"""
help = "Run the (2+1)D simulation and generate the coarsening video"


[tool.poe.tasks.make_ode]
shell = """
    uv run simulate_ode.py
"""
help = "Run the (1+1)D model simulation and generate the plots"